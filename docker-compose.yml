version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8001
      - SQLITE_DB_PATH=./data/researchmind.db
      - CHROMA_PERSIST_DIR=./data/chroma
      - UPLOAD_DIR=./data/uploads
      - REPORTS_DIR=./data/reports
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
